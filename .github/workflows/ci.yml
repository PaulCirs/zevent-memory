name: CI

on:
  pull_request:
  push:
    branches: [main]

# Le workflow ne fait que lire le code : droits minimaux.
permissions:
  contents: read

# Un nouveau push sur une PR annule la CI encore en cours pour l'ancien commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Vrai PostgreSQL pour les tests, comme en dev (même image que compose.yaml).
    services:
      db:
        image: postgres:19-alpine
        env:
          POSTGRES_USER: zevent
          POSTGRES_PASSWORD: zevent-ci
          POSTGRES_DB: zevent_memory
        ports:
          - 5432:5432
        # La CI attend que la base soit prête avant de lancer les étapes.
        options: >-
          --health-cmd "pg_isready -U zevent -d zevent_memory"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    # Pas de .env en CI : la config passe par les variables d'environnement.
    env:
      DATABASE_URL: postgresql+asyncpg://zevent:zevent-ci@127.0.0.1:5432/zevent_memory

    steps:
      - uses: actions/checkout@v7

      # setup-uv ne publie pas d'étiquette majeure (v10) : version complète obligatoire.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      # --locked : échoue si uv.lock n'est pas à jour avec pyproject.toml.
      - name: Installer les dépendances
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check . ../scripts

      - name: Ruff (format)
        run: uv run ruff format --check . ../scripts

      - name: mypy
        run: uv run mypy src tests

      - name: pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci : installe exactement package-lock.json (et échoue s'il n'est pas à jour).
      - name: Installer les dépendances
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Vitest
        run: npm test

      # tsc -b (vérification des types) puis vite build.
      - name: Build
        run: npm run build
