# Configuration d'Alembic (migrations du schéma de la base).
# L'URL de la base n'est pas ici : migrations/env.py la lit dans les Settings (DATABASE_URL).

[alembic]
script_location = %(here)s/migrations

# Noms de fichiers datés, pour les voir dans l'ordre : 2026_11_27_1830-<rev>_<description>.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

path_separator = os
output_encoding = utf-8

# Chaque migration générée passe par Ruff (format puis lint), comme le reste du code.
[post_write_hooks]
hooks = ruff_format, ruff_check

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
