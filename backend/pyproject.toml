[project]
name = "app"
version = "0.1.0"
description = "Backend de ZEvent Memory (API FastAPI)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

# Config Ruff : ruff.toml à la racine du repo (commune à backend/ et scripts/).

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
