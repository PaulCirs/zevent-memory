# Environnement de DEV : seulement PostgreSQL.
# FastAPI et Vite tournent en direct sur le poste (voir README).
# La pile de prod complète vivra dans deploy/.
services:
  db:
    image: postgres:19-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?à définir dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?à définir dans .env}
    ports:
      # 127.0.0.1 : la base n'est joignable que depuis ce poste, pas du réseau local.
      - '127.0.0.1:5432:5432'
    volumes:
      # Volume nommé : les données survivent à un `docker compose down`.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
